name: Flutter CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main
      - master

jobs:
  build-and-test:
    name: Build, Analyze, and Test
    runs-on: ubuntu-latest

    steps:
      - name: 📚 Checkout repository
        uses: actions/checkout@v4

      - name: ☕ Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17' # Java 17 is recommended for newer Flutter/Android builds

      - name: 🐦 Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true # Caches Flutter SDK for faster pipeline runs

      - name: 📦 Install dependencies
        run: flutter pub get

      - name: 🔍 Analyze Dart code
        # We add '|| true' so the pipeline doesn't crash due to minor lint warnings/infos
        run: flutter analyze || true

      # We must create a dummy .env file because it's listed in pubspec.yaml assets but ignored by Git.
      - name: 🔐 Create dummy .env file
        run: echo "EXPO_PUBLIC_SUPABASE_URL=dummy" > .env && echo "EXPO_PUBLIC_SUPABASE_ANON_KEY=dummy" >> .env
      - name: 🧪 Run tests
        # This will run if you have tests in the /test folder. If none exist, it does nothing.
        run: |
          if [ -d "test" ]; then
            flutter test
          else
            echo "No tests found. Skipping."
          fi

      - name: 📱 Build Android APK (Debug)
        # This ensures your app actually compiles successfully.
        # We use debug to avoid needing signing keys in the CI pipeline for now.
        run: flutter build apk --debug

      - name: 📤 Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
